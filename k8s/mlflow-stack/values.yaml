mlflow:
  image: ghcr.io/mlflow/mlflow
  tag: "2.18.0"
  replicas: 1
  servicePort: 5000
  # Real AWS S3 bucket name on EKS (seaweedfs.enabled: false). For local/dev with SeaweedFS,
  # this is the bucket name created inside the self-hosted SeaweedFS S3 gateway instead.
  artifactBucket: "mlflow-artifacts"

serviceAccount:
  name: mlflow-sa
  # ARN of an IAM role (IRSA) scoped to read/write on the artifact bucket above.
  # Leave empty when using self-hosted SeaweedFS instead of real S3.
  irsaRoleArn: ""

secrets:
  dbPassword: ""
  # Only used when seaweedfs.enabled is true (self-hosted S3-compatible store).
  # On EKS with real S3 + IRSA, no static keys are needed at all.
  s3AccessKey: ""
  s3SecretKey: ""

postgresql:
  enabled: true
  auth:
    username: mlflow_user
    database: mlflow_db
    existingSecret: "mlflow-prod-unified-secrets"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 5Gi

# Self-hosted S3-compatible store. Disabled by default (EKS target: real AWS S3 + IRSA).
# Enable via values-local.yaml for local/dev docker-compose-style deployments only.
seaweedfs:
  enabled: false

  s3:
    enabled: true
    port: 8333
    enableAuth: true
    existingConfigSecret: "mlflow-prod-seaweedfs-auth-config"

  filer:
    enabled: true # For future use for S3
  master:
    enabled: true
  volume:
    enabled: true

  volume:
    dir: "/data"
    sizeLimitMB: 5000