# Matches any node - used for CPU/memory-only training jobs.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
---
# Matches GPU nodes only.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-flavor
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
spec:
  nodeLabels:
    {{ .Values.gpuNodeLabel.key }}: {{ .Values.gpuNodeLabel.value | quote }}
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
