# Referenced by training job pods via secretKeyRef (see app/k8s_job/kubernetes_service.py's
# _secret_env_var), never read into the orchestrator's own env. Keys are only populated
# when the corresponding value is actually needed:
# - AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY: only when env.s3Endpoint is set (non-IRSA
#   S3-compatible store, e.g. local SeaweedFS/MinIO).
# - WANDB_API_KEY: only when secrets.wandbApiKey is set.
# - HF_TOKEN: only when secrets.hfToken is set.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-training-job-secrets" .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.env.s3Endpoint }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.wandbApiKey }}
  WANDB_API_KEY: {{ .Values.secrets.wandbApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.hfToken }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  {{- end }}
